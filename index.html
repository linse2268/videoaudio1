<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video- &amp; Audioanalyse</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; max-width: 800px; }
    @media (prefers-color-scheme: dark) { body { background:#111; color:#eee; } }
  </style>
</head>
<body>
  <h3>Video- &amp; Audioanalyse</h3>
  <p>Videodatei mit Ton wählen → „Analysieren“. Die Datei wird in Video und Audio getrennt,
     zuerst das Video, danach das Audio analysiert. Alles läuft lokal im Browser.</p>

  <div id="app"></div>

  <!-- Audio-Worker (als Text eingebettet, wird zur Laufzeit als Blob-Worker gestartet) -->
  <script type="text/plain" id="worker-src">
/* ============================================================
 * worker.js – Port von audioanalyse.py (librosa) nach Vanilla JS
 * Keine externen Bibliotheken: YIN, RMS, STFT/Mel, Onset-Detection
 * sind nach dem Quelltext von librosa 0.11.0 nachgebaut.
 * ============================================================ */
'use strict';

// ============================================================
// KONSTANTEN / GEWICHTE (identisch zum Python-Skript)
// ============================================================
const BORDER_LOW = 155.0;
const BORDER_HIGH = 165.0;
const MAX_VCPM = 2000;
const HALBTON_SCHWELLE = 1.0;
const MAX_EPM = 300;

const W_VCPM = 0.7;
const W_RMS_VC = 0.3;
const W_EPM = 0.7;
const W_RMS = 0.3;

const W_STIMME_VALENZ = 2 / 12;
const W_ACS = 4 / 12;
const W_VCS = 6 / 12;

const Config = {
  MAX_DURATION: 1500,
  HOP_LENGTH: 512,
  FMIN: 80,
  FMAX: 900,
  // librosa-Defaults (nicht im Python-Skript gesetzt, daher Defaults):
  FRAME_LENGTH: 2048,      // yin / rms / stft
  N_MELS: 128,             // onset_strength -> melspectrogram
  MEL_FMAX: null,          // librosa 0.11: onset_strength setzt fmax=0.5*sr (null -> sr/2)
  TROUGH_THRESHOLD: 0.1,   // yin
  PAD_MODE: 'constant'     // librosa >= 0.10 ('reflect' fuer librosa < 0.10)
};

const TINY_F32 = 1.1754943508222875e-38; // np.finfo(float32).tiny

// ============================================================
// HILFSFUNKTIONEN
// ============================================================

/** Python round(x, nd): exakte Dezimalrundung, Ties -> gerade Ziffer (banker's rounding). */
function pyRound(x, nd = 0) {
  if (!Number.isFinite(x)) return x;
  const p = 10 ** nd;
  const sign = x < 0 ? -1 : 1;
  const ax = Math.abs(x);
  const sc = ax * p;
  const fl = Math.floor(sc);
  const fr = sc - fl;
  let k;
  if (Math.abs(fr - 0.5) > 1e-4 && sc < 1e12) {
    k = fr > 0.5 ? fl + 1 : fl;
  } else {
    // Grenzfall: exakte Dezimalentwicklung des Doubles auswerten
    const s = ax.toFixed(100);
    const dot = s.indexOf('.');
    const kk = Number(s.slice(0, dot) + s.slice(dot + 1, dot + 1 + nd));
    const rest = s.slice(dot + 1 + nd);
    if (/^50*$/.test(rest)) k = kk % 2 === 0 ? kk : kk + 1;
    else k = rest.charCodeAt(0) >= 53 ? kk + 1 : kk;
  }
  return sign * (k / p);
}

function mean(a) {
  let s = 0;
  for (let i = 0; i < a.length; i++) s += a[i];
  return s / a.length;
}

function maxOf(a) {
  let m = -Infinity;
  for (let i = 0; i < a.length; i++) if (a[i] > m) m = a[i];
  return m;
}

let _lastPost = 0;
function progress(value, stage) {
  const now = performance.now();
  if (value >= 1 || now - _lastPost > 40) {
    _lastPost = now;
    self.postMessage({ type: 'progress', value, stage });
  }
}

// ============================================================
// FFT (radix-2, in-place, komplex, Vorwaerts e^{-i...})
// ============================================================
const _fftCache = {};
function makeFFT(N) {
  if (_fftCache[N]) return _fftCache[N];
  const levels = Math.round(Math.log2(N));
  const rev = new Uint32Array(N);
  for (let i = 0; i < N; i++) {
    let r = 0, x = i;
    for (let b = 0; b < levels; b++) { r = (r << 1) | (x & 1); x >>= 1; }
    rev[i] = r;
  }
  const cs = new Float64Array(N / 2), sn = new Float64Array(N / 2);
  for (let i = 0; i < N / 2; i++) {
    cs[i] = Math.cos((2 * Math.PI * i) / N);
    sn[i] = Math.sin((2 * Math.PI * i) / N);
  }
  const fft = function (re, im) {
    for (let i = 0; i < N; i++) {
      const j = rev[i];
      if (j > i) {
        let t = re[i]; re[i] = re[j]; re[j] = t;
        t = im[i]; im[i] = im[j]; im[j] = t;
      }
    }
    for (let size = 2; size <= N; size <<= 1) {
      const half = size >> 1, step = N / size;
      for (let i = 0; i < N; i += size) {
        for (let j = i, k = 0; j < i + half; j++, k += step) {
          const l = j + half;
          const tr = re[l] * cs[k] + im[l] * sn[k];
          const ti = im[l] * cs[k] - re[l] * sn[k];
          re[l] = re[j] - tr; im[l] = im[j] - ti;
          re[j] += tr; im[j] += ti;
        }
      }
    }
  };
  _fftCache[N] = fft;
  return fft;
}

// ============================================================
// FRAMING (librosa center=True, Padding N/2 links und rechts)
// ============================================================
function reflectIdx(i, n) {
  if (n === 1) return 0;
  const p = 2 * (n - 1);
  i = ((i % p) + p) % p;
  return i < n ? i : p - i;
}

function fillFrame(y, start, out, padMode) {
  const n = y.length, N = out.length;
  if (start >= 0 && start + N <= n) {
    for (let k = 0; k < N; k++) out[k] = y[start + k];
    return;
  }
  for (let k = 0; k < N; k++) {
    let i = start + k;
    if (i < 0 || i >= n) {
      if (padMode === 'reflect') i = reflectIdx(i, n);
      else { out[k] = 0; continue; }
    }
    out[k] = y[i];
  }
}

function timesLike(n, sr, hop) {
  const t = new Float64Array(n);
  for (let i = 0; i < n; i++) t[i] = (i * hop) / sr;
  return t;
}

// ============================================================
// AUDIO-EXTRAKTION / PIPELINE
// ============================================================
function trimAudio(y, sr, maxDuration) {
  const maxSamples = Math.trunc(sr * maxDuration);
  return y.length > maxSamples ? y.subarray(0, maxSamples) : y;
}

/**
 * librosa.yin (+ librosa.feature.rms im selben Durchlauf, gleiche Frames).
 * Autokorrelation per FFT; zwei Frames werden zu einer komplexen FFT gepackt.
 */
function computePitchAndRms(y, sr, cfg) {
  // librosa 0.11: autocorrelate() ueber den GANZEN Frame (linear, FFT-Laenge 2N),
  // d[tau] = 2*(acf[0]-acf[tau]) - cumsum(x^2)[tau-1]; max_period = min(ceil(sr/fmin), N-1)
  const N = cfg.FRAME_LENGTH, M = 2 * N, HOP = cfg.HOP_LENGTH;
  const nFrames = 1 + Math.floor(y.length / HOP);
  const minPeriod = Math.floor(sr / cfg.FMAX);
  const maxPeriod = Math.min(Math.ceil(sr / cfg.FMIN), N - 1);
  const L = maxPeriod - minPeriod + 1;
  if (L < 3) throw new Error('Samplerate zu niedrig fuer YIN-Parameter');
  const thr = cfg.TROUGH_THRESHOLD;
  const fft = makeFFT(M);

  const f0 = new Float64Array(nFrames);
  const rms = new Float64Array(nFrames);
  const x = new Float64Array(N);
  const zr = new Float64Array(M), zi = new Float64Array(M);
  const qr = new Float64Array(M), qi = new Float64Array(M);
  const cs = [new Float64Array(N), new Float64Array(N)];
  const yin = new Float64Array(L);

  for (let f = 0; f < nFrames; f += 2) {
    const cnt = f + 1 < nFrames ? 2 : 1;
    zr.fill(0); zi.fill(0);

    for (let p = 0; p < cnt; p++) {
      const fi = f + p;
      fillFrame(y, fi * HOP - (N >> 1), x, cfg.PAD_MODE);
      const tgt = p === 0 ? zr : zi;
      const c = cs[p];
      let acc = 0;
      for (let k = 0; k < N; k++) { tgt[k] = x[k]; acc += x[k] * x[k]; c[k] = acc; }
      rms[fi] = Math.sqrt(acc / N);
    }

    // zwei reelle Frames in einer komplexen FFT: z = x1 + i*x2
    fft(zr, zi);
    for (let k = 0; k < M; k++) {
      const m = (M - k) & (M - 1);
      const ar = (zr[k] + zr[m]) * 0.5, ai = (zi[k] - zi[m]) * 0.5;
      const br = (zi[k] + zi[m]) * 0.5, bi = -(zr[k] - zr[m]) * 0.5;
      qr[k] = ar * ar + ai * ai;       // |X1|^2
      qi[k] = -(br * br + bi * bi);    // -|X2|^2  (Konjugation fuer inverse FFT)
    }
    fft(qr, qi); // ifft(Q) = conj(fft(conj(Q)))/M -> acf1 = qr/M, acf2 = -qi/M

    for (let p = 0; p < cnt; p++) {
      const fi = f + p;
      const c = cs[p];
      const acfAt = p === 0 ? (t) => qr[t] / M : (t) => -qi[t] / M;
      const acf0 = acfAt(0);

      let cum = 0;
      for (let tau = 1; tau <= maxPeriod; tau++) {
        const d = 2 * (acf0 - acfAt(tau)) - c[tau - 1];
        cum += d;
        if (tau >= minPeriod) yin[tau - minPeriod] = d / (cum / tau + TINY_F32);
      }

      let globalMin = 0, minV = yin[0];
      for (let i = 1; i < L; i++) if (yin[i] < minV) { minV = yin[i]; globalMin = i; }

      let chosen = -1;
      for (let i = 0; i < L; i++) {
        let trough;
        if (i === 0) trough = yin[0] < yin[1];
        else {
          const next = i < L - 1 ? yin[i + 1] : yin[i];
          trough = yin[i] < yin[i - 1] && yin[i] <= next;
        }
        if (trough && yin[i] < thr) { chosen = i; break; }
      }
      if (chosen < 0) chosen = globalMin;

      // parabolische Interpolation (librosa _pi_stencil; Rand = 0)
      let shift = 0;
      if (chosen > 0 && chosen < L - 1) {
        const a = yin[chosen - 1] + yin[chosen + 1] - 2 * yin[chosen];
        const b = (yin[chosen + 1] - yin[chosen - 1]) / 2;
        shift = Math.abs(b) >= Math.abs(a) ? 0 : -b / a;
      }
      f0[fi] = sr / (minPeriod + chosen + shift);
    }

    if ((f & 1023) === 0) progress(0.45 * (f / nFrames), 'Pitch (YIN) & RMS');
  }
  return { f0, rms };
}

/** librosa.amplitude_to_db(rms, ref=np.max) inkl. top_db=80 */
function rmsToDb(rms) {
  const amin = 1e-5 * 1e-5; // amin**2
  const refMax = maxOf(rms);
  const refPow = refMax * refMax;
  const refDb = 10 * Math.log10(Math.max(amin, refPow));
  const db = new Float64Array(rms.length);
  let mx = -Infinity;
  for (let i = 0; i < rms.length; i++) {
    db[i] = 10 * Math.log10(Math.max(amin, rms[i] * rms[i])) - refDb;
    if (db[i] > mx) mx = db[i];
  }
  const floor = mx - 80.0;
  for (let i = 0; i < db.length; i++) if (db[i] < floor) db[i] = floor;
  return db;
}

// ---------- Mel-Filterbank (Slaney, norm='slaney', htk=False) ----------
function hzToMel(f) {
  const fSp = 200 / 3, minLogHz = 1000, minLogMel = minLogHz / fSp, logstep = Math.log(6.4) / 27;
  return f >= minLogHz ? minLogMel + Math.log(f / minLogHz) / logstep : f / fSp;
}
function melToHz(m) {
  const fSp = 200 / 3, minLogHz = 1000, minLogMel = minLogHz / fSp, logstep = Math.log(6.4) / 27;
  return m >= minLogMel ? minLogHz * Math.exp(logstep * (m - minLogMel)) : fSp * m;
}

function melFilterbank(sr, nFft, nMels, fmin, fmax) {
  const nb = (nFft >> 1) + 1;
  const fftF = new Float64Array(nb);
  const fstep = sr / 2 / (nb - 1);
  for (let i = 0; i < nb; i++) fftF[i] = i * fstep;

  const minMel = hzToMel(fmin), maxMel = hzToMel(fmax);
  const mstep = (maxMel - minMel) / (nMels + 1);
  const melF = new Float64Array(nMels + 2);
  for (let i = 0; i < nMels + 1; i++) melF[i] = melToHz(minMel + i * mstep);
  melF[nMels + 1] = melToHz(maxMel);

  const bands = [];
  const w = new Float64Array(nb);
  for (let i = 0; i < nMels; i++) {
    const fd0 = melF[i + 1] - melF[i], fd1 = melF[i + 2] - melF[i + 1];
    const enorm = 2.0 / (melF[i + 2] - melF[i]);
    let s = -1, e = -1;
    for (let k = 0; k < nb; k++) {
      const lower = -(melF[i] - fftF[k]) / fd0;
      const upper = (melF[i + 2] - fftF[k]) / fd1;
      let v = Math.max(0, Math.min(lower, upper));
      v = Math.fround(Math.fround(v) * enorm); // librosa: float32-Gewichte
      v = Math.fround(v);
      w[k] = v;
      if (v > 0) { if (s < 0) s = k; e = k; }
    }
    bands.push(s < 0 ? { start: 0, w: new Float64Array(0) } : { start: s, w: w.slice(s, e + 1) });
  }
  return bands;
}

/** melspectrogram(power=2) -> power_to_db(ref=1.0, amin=1e-10, top_db=80) (Top-dB-Clip folgt in onsetStrength) */
function computeMelDb(y, sr, cfg) {
  const N = cfg.FRAME_LENGTH, HOP = cfg.HOP_LENGTH, NM = cfg.N_MELS, NB = (N >> 1) + 1;
  const nFrames = 1 + Math.floor(y.length / HOP);
  const bands = melFilterbank(sr, N, NM, 0.0, cfg.MEL_FMAX || sr / 2);
  const fft = makeFFT(N);

  const win = new Float64Array(N); // Hann, periodisch (fftbins=True)
  for (let n = 0; n < N; n++) win[n] = 0.5 - 0.5 * Math.cos((2 * Math.PI * n) / N);

  const out = new Float32Array(nFrames * NM);
  const x = new Float64Array(N);
  const zr = new Float64Array(N), zi = new Float64Array(N);
  const pa = new Float64Array(NB), pb = new Float64Array(NB);

  for (let f = 0; f < nFrames; f += 2) {
    const two = f + 1 < nFrames;
    fillFrame(y, f * HOP - (N >> 1), x, cfg.PAD_MODE);
    for (let k = 0; k < N; k++) zr[k] = x[k] * win[k];
    if (two) {
      fillFrame(y, (f + 1) * HOP - (N >> 1), x, cfg.PAD_MODE);
      for (let k = 0; k < N; k++) zi[k] = x[k] * win[k];
    } else zi.fill(0);
    fft(zr, zi);

    for (let k = 0; k < NB; k++) {
      const m = (N - k) & (N - 1);
      const ar = (zr[k] + zr[m]) * 0.5, ai = (zi[k] - zi[m]) * 0.5;
      const br = (zi[k] + zi[m]) * 0.5, bi = -(zr[k] - zr[m]) * 0.5;
      pa[k] = ar * ar + ai * ai;
      pb[k] = br * br + bi * bi;
    }

    for (let m = 0; m < NM; m++) {
      const { start, w } = bands[m];
      let sa = 0, sb = 0;
      for (let k = 0; k < w.length; k++) { sa += w[k] * pa[start + k]; sb += w[k] * pb[start + k]; }
      out[f * NM + m] = 10 * Math.log10(Math.max(1e-10, sa));
      if (two) out[(f + 1) * NM + m] = 10 * Math.log10(Math.max(1e-10, sb));
    }
    if ((f & 1023) === 0) progress(0.45 + 0.47 * (f / nFrames), 'Spektrum / Onset-Staerke');
  }
  return { melDb: out, nFrames };
}

/** librosa.onset.onset_strength(y, sr, hop_length) */
function onsetStrength(melDb, nFrames, cfg) {
  const NM = cfg.N_MELS, HOP = cfg.HOP_LENGTH;
  let mx = -Infinity;
  for (let i = 0; i < melDb.length; i++) if (melDb[i] > mx) mx = melDb[i];
  const top = mx - 80.0; // power_to_db top_db

  const lag = 1;
  const pad = lag + Math.floor(cfg.FRAME_LENGTH / (2 * HOP));
  const env = new Float32Array(nFrames);
  for (let k = 0; k < nFrames - 1; k++) {
    const j = k + pad;
    if (j >= nFrames) break;
    const a = k * NM, b = (k + 1) * NM;
    let s = 0;
    for (let m = 0; m < NM; m++) {
      const d = Math.max(melDb[b + m], top) - Math.max(melDb[a + m], top);
      if (d > 0) s += d;
    }
    env[j] = s / NM;
  }
  return env;
}

/** librosa.onset.onset_detect(onset_envelope=..., sr, hop_length) inkl. util.peak_pick */
function onsetDetect(envIn, sr, hop) {
  const n = envIn.length;
  if (n === 0) return [];
  const x = new Float64Array(n);
  let mn = Infinity;
  for (let i = 0; i < n; i++) if (envIn[i] < mn) mn = envIn[i];
  let mx = -Infinity;
  for (let i = 0; i < n; i++) { x[i] = envIn[i] - mn; if (x[i] > mx) mx = x[i]; }
  let any = false, finite = true;
  for (let i = 0; i < n; i++) {
    x[i] = x[i] / (mx + TINY_F32);
    if (x[i] !== 0) any = true;
    if (!Number.isFinite(x[i])) finite = false;
  }
  if (!any || !finite) return [];

  const preMax = Math.ceil(Math.floor((0.03 * sr) / hop));
  const postMax = Math.ceil(Math.floor((0.00 * sr) / hop) + 1);
  const preAvg = Math.ceil(Math.floor((0.10 * sr) / hop));
  const postAvg = Math.ceil(Math.floor((0.10 * sr) / hop) + 1);
  const wait = Math.ceil(Math.floor((0.03 * sr) / hop));
  const delta = 0.07;

  // gleitendes Maximum (scipy maximum_filter1d, mode='constant', cval=x.min())
  let xmin = Infinity;
  for (let i = 0; i < n; i++) if (x[i] < xmin) xmin = x[i];
  const maxLen = preMax + postMax;
  const maxOrigin = Math.ceil(0.5 * (preMax - postMax)) || 0;
  const maxHalf = Math.floor(maxLen / 2);
  const movMax = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    const s = i - maxHalf - maxOrigin, e = s + maxLen - 1;
    let m = s < 0 || e >= n ? xmin : -Infinity;
    for (let k = Math.max(0, s); k <= Math.min(n - 1, e); k++) if (x[k] > m) m = x[k];
    movMax[i] = m;
  }

  // gleitender Mittelwert x[i-preAvg : i+postAvg] (mit Abschneiden an den Raendern,
  // entspricht uniform_filter1d + Randkorrektur in librosa)
  const pre = new Float64Array(n + 1);
  for (let i = 0; i < n; i++) pre[i + 1] = pre[i] + x[i];

  const peaks = [];
  let last = -Infinity;
  for (let i = 0; i < n; i++) {
    const det = x[i] === movMax[i] ? x[i] : 0;
    if (det === 0) continue;
    const s = Math.max(0, i - preAvg), e = Math.min(n, i + postAvg);
    const avg = (pre[e] - pre[s]) / (e - s);
    if (det >= avg + delta && i > last + wait) { peaks.push(i); last = i; }
  }
  return peaks;
}

/** numpy.interp */
function interp(xq, xp, fp) {
  const n = xp.length;
  return xq.map((q) => {
    if (q <= xp[0]) return fp[0];
    if (q >= xp[n - 1]) return fp[n - 1];
    let lo = 0, hi = n - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (xp[mid] <= q) lo = mid; else hi = mid; }
    const slope = (fp[lo + 1] - fp[lo]) / (xp[lo + 1] - xp[lo]);
    return slope * (q - xp[lo]) + fp[lo];
  });
}

// ============================================================
// ERGEBNISSE (RAM-Pfad, entspricht compute_*_results)
// ============================================================
function computeOnsetResults(tOnsets, rmsAtOnsets, intensities) {
  const count = tOnsets.length;
  const duration = count > 0 ? tOnsets[count - 1] : 0.0;
  return {
    events_per_minute: duration > 0 ? pyRound(count / (duration / 60), 2) : 0.0,
    rms_mean_at_onsets: count > 0 ? pyRound(mean(rmsAtOnsets), 4) : 0.0,
    intensity_mean: count > 0 ? pyRound(mean(intensities), 4) : 0.0
  };
}

function computePitchResults(f0, borderLow = BORDER_LOW, borderHigh = BORDER_HIGH) {
  const total = f0.length;
  let unter = 0, grenze = 0, ueber = 0, stumm = 0;
  for (let i = 0; i < total; i++) {
    const hz = f0[i];
    if (hz == null || Number.isNaN(hz)) stumm++;
    else if (hz < borderLow) unter++;
    else if (hz > borderHigh) ueber++;
    else grenze++;
  }
  const voiced = total - stumm;
  if (voiced === 0) return { unter_pct: 0.0, grenze_pct: 0.0, ueber_pct: 0.0 };
  return {
    unter_pct: pyRound((unter / voiced) * 100, 2),
    grenze_pct: pyRound((grenze / voiced) * 100, 2),
    ueber_pct: pyRound((ueber / voiced) * 100, 2)
  };
}

function detectVoiceChanges(pitchHzList, thresholdSemitones = HALBTON_SCHWELLE) {
  const idx = [];
  let prev = null;
  for (let i = 0; i < pitchHzList.length; i++) {
    const hz = pitchHzList[i];
    if (hz == null || Number.isNaN(hz)) continue;
    if (prev !== null && prev > 0 && hz > 0) {
      if (Math.abs(12 * Math.log2(hz / prev)) > thresholdSemitones) idx.push(i);
    }
    prev = hz;
  }
  return idx;
}

function computeVoiceChangeResults(f0, tPitch, rmsDb, thresholdSemitones = HALBTON_SCHWELLE) {
  const idx = detectVoiceChanges(f0, thresholdSemitones);
  const count = idx.length;
  const duration = tPitch.length > 0 ? tPitch[tPitch.length - 1] : 0.0;
  return {
    voice_change_count: count,
    voice_changes_per_minute: duration > 0 && count > 0 ? pyRound(count / (duration / 60), 2) : 0.0,
    rms_mean_at_changes: count > 0 ? pyRound(mean(idx.map((i) => rmsDb[i])), 4) : 0.0
  };
}

// ============================================================
// SCORES (1:1 aus dem Python-Skript)
// ============================================================
function calcVcs(vc, maxVcpm = MAX_VCPM, wVcpm = W_VCPM, wRms = W_RMS_VC) {
  const vcpm = vc.voice_changes_per_minute;
  const rmsLinear = 10 ** (vc.rms_mean_at_changes / 20);
  const vcpmNormiert = Math.min(100, (vcpm / maxVcpm) * 100);
  return pyRound(wVcpm * vcpmNormiert + wRms * (rmsLinear * 100), 2);
}

function calcStimmeScore(pitch) {
  const diff = pitch.ueber_pct - pitch.unter_pct;
  return pyRound(Math.min(100, Math.max(0, 50 + diff)), 2);
}

function calcActivityScoreNormiert(onset, maxEpm = MAX_EPM, wEpm = W_EPM, wRms = W_RMS) {
  const epm = onset.events_per_minute;
  const rmsLinear = 10 ** (onset.rms_mean_at_onsets / 20);
  const epmNormiert = Math.min(100, (epm / maxEpm) * 100);
  return pyRound(wEpm * epmNormiert + wRms * (rmsLinear * 100), 2);
}

function calcAufmerksamkeitsScore(onset, pitch, vc) {
  const stimmeValenz = calcStimmeScore(pitch);
  const acs = calcActivityScoreNormiert(onset);
  const vcs = calcVcs(vc);
  return pyRound(W_STIMME_VALENZ * stimmeValenz + W_ACS * acs + W_VCS * vcs, 2);
}

// ============================================================
// JSON-PFAD (entspricht export_analysis_json + analyze_* + output())
// Werte werden wie in den JSON-Dateien auf 4 Nachkommastellen gerundet.
// ============================================================
function buildJsonData(tOnsets, intensities, rmsAtOnsets, tPitch, f0, rmsDb) {
  const count = tOnsets.length;
  const duration = count > 0 ? tOnsets[count - 1] : 0.0;
  const onsetData = {
    onset_count: count,
    duration_seconds: pyRound(duration, 4),
    summary: {
      events_per_minute: duration > 0 ? pyRound(count / (duration / 60), 2) : 0,
      intensity_mean: count > 0 ? pyRound(mean(intensities), 4) : 0,
      intensity_max: count > 0 ? pyRound(maxOf(intensities), 4) : 0
    },
    onsets: tOnsets.map((t, i) => ({
      index: i,
      time_seconds: pyRound(t, 4),
      intensity_raw: pyRound(intensities[i], 4),
      rms_db: pyRound(rmsAtOnsets[i], 4)
    }))
  };
  const n = f0.length;
  const pitchData = { sample_count: n, time: new Float64Array(n), hz: new Array(n), rms: new Float64Array(n) };
  for (let i = 0; i < n; i++) {
    pitchData.time[i] = pyRound(tPitch[i], 4);
    pitchData.hz[i] = Number.isNaN(f0[i]) ? null : pyRound(f0[i], 4);
    pitchData.rms[i] = pyRound(rmsDb[i], 4);
  }
  return { onsetData, pitchData };
}

function analyzeOnsets(data) {
  const rms = data.onsets.map((o) => o.rms_db);
  const rmsMean = rms.length ? pyRound(mean(rms), 4) : 0.0;
  const rmsLinear = 10 ** (rmsMean / 20);
  return {
    onset_count: data.onset_count,
    events_per_minute: data.summary.events_per_minute,
    intensity_mean: data.summary.intensity_mean,
    intensity_max: data.summary.intensity_max,
    rms_mean_at_onsets: rmsMean,
    rms_max_at_onsets: rms.length ? pyRound(maxOf(rms), 4) : 0.0,
    activity_score: pyRound(data.summary.events_per_minute * rmsLinear, 2)
  };
}

function analyzePitchDistribution(pd) {
  let unter = 0, grenze = 0, ueber = 0, stumm = 0;
  for (const hz of pd.hz) {
    if (hz === null) stumm++;
    else if (hz < BORDER_LOW) unter++;
    else if (hz > BORDER_HIGH) ueber++;
    else grenze++;
  }
  const total = pd.hz.length, voiced = total - stumm;
  if (voiced === 0) return { total, voiced: 0, stumm, unter_pct: 0.0, grenze_pct: 0.0, ueber_pct: 0.0 };
  return {
    total, voiced, stumm,
    unter_pct: pyRound((unter / voiced) * 100, 2),
    grenze_pct: pyRound((grenze / voiced) * 100, 2),
    ueber_pct: pyRound((ueber / voiced) * 100, 2)
  };
}

function analyzeVoiceChanges(pd, thresholdSemitones = HALBTON_SCHWELLE) {
  const idx = detectVoiceChanges(pd.hz, thresholdSemitones);
  const count = idx.length;
  const duration = pd.time.length ? pd.time[pd.time.length - 1] : 0.0;
  return {
    voice_change_count: count,
    voice_changes_per_minute: duration > 0 && count > 0 ? pyRound(count / (duration / 60), 2) : 0.0,
    rms_mean_at_changes: count > 0 ? pyRound(mean(idx.map((i) => pd.rms[i])), 4) : 0.0
  };
}

/** entspricht output() – liefert die Zeilen statt zu printen */
function outputFromJson(onsetData, pitchData) {
  const onsetResults = analyzeOnsets(onsetData);
  const pitchResults = analyzePitchDistribution(pitchData);
  const vcResults = analyzeVoiceChanges(pitchData);

  const stimmeValenz = calcStimmeScore(pitchResults);
  const acs = calcActivityScoreNormiert(onsetResults);
  const vcs = calcVcs(vcResults);
  const score = calcAufmerksamkeitsScore(onsetResults, pitchResults, vcResults);

  const rmsLinOnsets = pyRound(10 ** (onsetResults.rms_mean_at_onsets / 20), 4);
  const rmsLinChanges = pyRound(10 ** (vcResults.rms_mean_at_changes / 20), 4);

  const zeilen = [
    ['EPM (Events/Min, Onsets)', onsetResults.events_per_minute],
    ['RMS an Onsets (dB)', onsetResults.rms_mean_at_onsets],
    ['RMS-linear an Onsets (0-1, → ACS)', rmsLinOnsets],
    ['ACS – Activity-Score normiert', acs],
    ['', null],
    ['VCPM (Stimmwechsel/Min)', vcResults.voice_changes_per_minute],
    ['RMS an Stimmwechseln (dB)', vcResults.rms_mean_at_changes],
    ['RMS-linear an Stimmwechseln (0-1, → VCS)', rmsLinChanges],
    ['VCS – Stimmwechsel-Score normiert', vcs],
    ['', null],
    ['Pitch unter 155Hz (Männerstimme)', `${pitchResults.unter_pct}%`],
    ['Pitch Grauzone 155-165Hz', `${pitchResults.grenze_pct}%`],
    ['Pitch über 165Hz (Frauen/Kinder)', `${pitchResults.ueber_pct}%`],
    ['Stimme-Valenz (0-100, 50=neutral)', stimmeValenz]
  ];
  return {
    zeilen,
    aufmerksamkeits_score: score,
    onset_results: onsetResults,
    pitch_results: pitchResults,
    voice_change_results: vcResults,
    stimme_valenz: stimmeValenz,
    activity_score_normiert: acs,
    voice_change_score: vcs
  };
}

function exportJsonStrings(onsetData, pitchData, tOnsetEnvTimes, env) {
  const envelope = [];
  for (let i = 0; i < env.length; i++) {
    envelope.push({ time_seconds: pyRound(tOnsetEnvTimes[i], 4), strength: pyRound(env[i], 4) });
  }
  const onsetJson = Object.assign({}, onsetData, { envelope });
  const pitch = [];
  for (let i = 0; i < pitchData.hz.length; i++) {
    pitch.push({ index: i, time_seconds: pitchData.time[i], pitch_hz: pitchData.hz[i], rms_db: pitchData.rms[i] });
  }
  return {
    'onset.json': JSON.stringify(onsetJson, null, 2),
    'pitch.json': JSON.stringify({ sample_count: pitchData.sample_count, pitch }, null, 2)
  };
}

// ============================================================
// HAUPT-PIPELINE (entspricht analyze_file() + main() + output())
// ============================================================
function analyzeAudio(yIn, sr, options) {
  const t0 = performance.now();
  const cfg = Object.assign({}, Config, options.config || {});
  const y = trimAudio(yIn, sr, cfg.MAX_DURATION);
  const HOP = cfg.HOP_LENGTH;

  // Pitch (YIN) + RMS
  progress(0, 'Pitch (YIN) & RMS');
  const { f0, rms } = computePitchAndRms(y, sr, cfg);
  const tPitch = timesLike(f0.length, sr, HOP);
  const rmsDb = rmsToDb(rms);
  const tRms = tPitch; // gleiche Frames / gleiche Zeitachse

  // Onsets
  const { melDb, nFrames } = computeMelDb(y, sr, cfg);
  progress(0.93, 'Onset-Detection');
  const env = onsetStrength(melDb, nFrames, cfg);
  const onsets = onsetDetect(env, sr, HOP);
  const tOnsets = onsets.map((o) => (o * HOP) / sr);
  const intensities = onsets.map((o) => env[o]);
  const rmsAtOnsets = interp(tOnsets, tRms, rmsDb);

  // Ergebnisse + Scores (RAM-Pfad = analyze_file)
  progress(0.97, 'Scores');
  const onsetResults = computeOnsetResults(tOnsets, rmsAtOnsets, intensities);
  const pitchResults = computePitchResults(f0);
  const vcResults = computeVoiceChangeResults(f0, tPitch, rmsDb);

  const stimmeValenz = calcStimmeScore(pitchResults);
  const acs = calcActivityScoreNormiert(onsetResults);
  const vcs = calcVcs(vcResults);
  const score = calcAufmerksamkeitsScore(onsetResults, pitchResults, vcResults);

  const analyzeFile = {
    stimme_valenz: stimmeValenz,
    activity_score_normiert: acs,
    voice_change_score: vcs,
    aufmerksamkeits_score: score,
    duration_seconds: pyRound(y.length / sr, 4),
    onset_count: tOnsets.length,
    events_per_minute: onsetResults.events_per_minute,
    rms_mean_at_onsets: onsetResults.rms_mean_at_onsets,
    voice_change_count: vcResults.voice_change_count,
    voice_changes_per_minute: vcResults.voice_changes_per_minute,
    rms_mean_at_changes: vcResults.rms_mean_at_changes,
    unter_pct: pitchResults.unter_pct,
    grenze_pct: pitchResults.grenze_pct,
    ueber_pct: pitchResults.ueber_pct
  };

  // JSON-Pfad (wie Python: export -> output()), mit gerundeten Werten
  const { onsetData, pitchData } = buildJsonData(tOnsets, intensities, rmsAtOnsets, tPitch, f0, rmsDb);
  const output = outputFromJson(onsetData, pitchData);

  let jsonExport = null;
  if (options.exportJson) {
    jsonExport = exportJsonStrings(onsetData, pitchData, timesLike(env.length, sr, HOP), env);
  }

  progress(1, 'Fertig');
  return {
    meta: {
      sample_rate: sr,
      samples: y.length,
      frames: nFrames,
      duration_seconds: analyzeFile.duration_seconds,
      elapsed_ms: Math.round(performance.now() - t0)
    },
    analyze_file: analyzeFile,
    details: { onset_results: onsetResults, pitch_results: pitchResults, voice_change_results: vcResults },
    output,
    json_export: jsonExport
  };
}

self.onmessage = (e) => {
  const { type, samples, sampleRate, options } = e.data;
  if (type !== 'analyze') return;
  try {
    const result = analyzeAudio(samples, sampleRate, options || {});
    self.postMessage({ type: 'result', result });
  } catch (err) {
    self.postMessage({ type: 'error', message: String((err && err.message) || err) });
  }
};

 *      auf der gesamten Datei (Browser demuxt selbst), native Samplerate aus Header gelesen.

'use strict';

  // Samplerate aus Header (damit decodeAudioData nicht resampled)
  // ============================================================

      const sizes = new Uint32Array(nSamples);
      for (let i = 0; i < nSamples; i++) sizes[i] = constSize || dv.getUint32(stszB.start + 12 + i * 4);

      const ts = new Float64Array(nSamples + 1), dur = new Float64Array(nSamples);
      {
        const cnt = dv.getUint32(sttsB.start + 4);
        let s = 0, t = 0;
        for (let i = 0; i < cnt && s < nSamples; i++) {
          const c = dv.getUint32(sttsB.start + 8 + i * 8), d = dv.getUint32(sttsB.start + 12 + i * 8);
          for (let j = 0; j < c && s < nSamples; j++, s++) { ts[s] = t; dur[s] = d; t += d; }
        }
        ts[nSamples] = t;
      }

      const nChunks = dv.getUint32(stcoB.start + 4);
      const chunkOffset = (i) => is64
        ? Number(dv.getBigUint64(stcoB.start + 8 + i * 8))
        : dv.getUint32(stcoB.start + 8 + i * 4);
      const stscCnt = dv.getUint32(stscB.start + 4);
      const stsc = [];
      for (let i = 0; i < stscCnt; i++) {
        stsc.push([dv.getUint32(stscB.start + 8 + i * 12), dv.getUint32(stscB.start + 12 + i * 12)]);
      }

      // Chunks -> zusammenhängende "Runs" (weniger Dateizugriffe)
      const runs = [];
      let sample = 0, si = 0;
      for (let c = 0; c < nChunks && sample < nSamples; c++) {
        while (si + 1 < stsc.length && stsc[si + 1][0] <= c + 1) si++;
        const per = stsc[si][1];
        const off = chunkOffset(c);
        let bytes = 0;
        const cnt = Math.min(per, nSamples - sample);
        for (let k = 0; k < cnt; k++) bytes += sizes[sample + k];
        const last = runs[runs.length - 1];
        if (last && last.offset + last.size === off) { last.size += bytes; last.count += cnt; }
        else runs.push({ offset: off, size: bytes, firstSample: sample, count: cnt });
        sample += cnt;
      }

      return {
        status: nSamples > 0 ? 'ok' : 'unsupported',
        track: { codec, description, sampleRate: rate, channels: channels || 2, timescale, sizes, ts, dur, runs, nSamples }
      };
    }
    if (!sawAudio) return { status: fragmented ? 'fragmented' : 'noaudio' };
    return { status: fragmented ? 'fragmented' : 'unsupported' };
  }

  async function decodeMp4Audio(file, t, maxDuration, onProgress) {
    const cfg = { codec: t.codec, sampleRate: t.sampleRate, numberOfChannels: t.channels };
    if (t.description) cfg.description = t.description;
    const sup = await AudioDecoder.isConfigSupported(cfg);
    if (!sup.supported) throw new Error('Audio-Codec ' + t.codec + ' wird von WebCodecs nicht unterstützt');

    const parts = [];
    let total = 0, outRate = 0, error = null;
    const decoder = new AudioDecoder({
      output: (ad) => {
        const n = ad.numberOfFrames, ch = ad.numberOfChannels;
        outRate = ad.sampleRate;
        const mono = new Float32Array(n), tmp = new Float32Array(n);
        for (let c = 0; c < ch; c++) {
          ad.copyTo(tmp, { planeIndex: c, format: 'f32-planar' });
          for (let i = 0; i < n; i++) mono[i] += tmp[i];
        }
        if (ch > 1) for (let i = 0; i < n; i++) mono[i] /= ch;
        ad.close();
        parts.push(mono);
        total += n;
      },
      error: (e) => { error = e; }
    });
    decoder.configure(cfg);

    const limitTicks = maxDuration * t.timescale;
    const BATCH = 24;
    const runs = t.runs;
    for (let r = 0; r < runs.length && !error; r += BATCH) {
      if (t.ts[runs[r].firstSample] > limitTicks) break;
      const group = runs.slice(r, r + BATCH);
      const bufs = await Promise.all(group.map(async (run) =>
        new Uint8Array(await file.slice(run.offset, run.offset + run.size).arrayBuffer())));
      for (let g = 0; g < group.length; g++) {
        const run = group[g], buf = bufs[g];
        let o = 0;
        for (let k = 0; k < run.count; k++) {
          const s = run.firstSample + k, sz = t.sizes[s];
          if (o + sz > buf.length) break;
          decoder.decode(new EncodedAudioChunk({
            type: 'key',
            timestamp: Math.round((t.ts[s] * 1e6) / t.timescale),
            duration: Math.round((t.dur[s] * 1e6) / t.timescale),
            data: buf.subarray(o, o + sz)
          }));
          o += sz;
        }
        while (decoder.decodeQueueSize > 64 && !error) await sleep0();
      }
      onProgress(Math.min(1, t.ts[group[group.length - 1].firstSample] / limitTicks));
    }
    if (!error) await decoder.flush();
    if (decoder.state !== 'closed') decoder.close();
    if (error) throw new Error('AudioDecoder: ' + (error.message || error));
    if (!total) throw new Error('Keine Audiodaten dekodiert');

    const len = Math.min(total, Math.trunc(outRate * maxDuration));
    const samples = new Float32Array(len);
    let pos = 0;
    for (const p of parts) {
      if (pos >= len) break;
      const n = Math.min(p.length, len - pos);
      samples.set(n === p.length ? p : p.subarray(0, n), pos);
      pos += n;
    }
    return { samples, sampleRate: outRate, verified: true, method: 'webcodecs-mp4' };
  }

  // ============================================================
  // Audio-Extraktion (Strategie wählen)
  // ============================================================
  async function extractAudio(file, maxDuration, onProgress, warnings) {
    const head = new Uint8Array(await file.slice(0, 12).arrayBuffer());
    const isMp4 = head.length >= 8 && MP4_BRANDS.includes(fourcc(head, 4));
    let hint = null;

    if (isMp4) {
      try {
        const moov = await findMoov(file);
        if (moov) {
          const res = parseMp4Audio(moov);
          if (res.status === 'noaudio') return null;               // Video ohne Tonspur
          if (res.status === 'ok') {
            hint = res.track.sampleRate;
            if (typeof AudioDecoder !== 'undefined' && typeof EncodedAudioChunk !== 'undefined') {
              try { return await decodeMp4Audio(file, res.track, maxDuration, onProgress); }
              catch (e) { warnings.push('WebCodecs-Pfad fehlgeschlagen (' + e.message + '), nutze Fallback.'); }
            } else warnings.push('WebCodecs nicht verfügbar, nutze Fallback (lädt die ganze Datei).');
          }
        }
      } catch (e) {
        warnings.push('MP4-Parser fehlgeschlagen (' + e.message + '), nutze Fallback.');
      }
    }
    onProgress(0);
    return await decodeWholeFile(file, hint, maxDuration);
  }

  // ============================================================
  // Video-Teil
  // ============================================================
  function openVideo(file, videoElement) {
    return new Promise((resolve) => {
      const url = URL.createObjectURL(file);
      const el = videoElement || document.createElement('video');
      el.preload = 'metadata';
      el.muted = true;
      el.playsInline = true;
      let settled = false;
      const finish = (ok, why) => {
        if (settled) return;
        settled = true;
        clearTimeout(tid);
        el.removeEventListener('loadedmetadata', onMeta);
        el.removeEventListener('error', onErr);
        if (ok && el.videoWidth > 0) {
          resolve({ ok: true, video: { url, element: el, duration: el.duration, width: el.videoWidth, height: el.videoHeight } });
        } else {
          if (!videoElement) el.removeAttribute('src');
          URL.revokeObjectURL(url);
          resolve({ ok: false, why: why || 'Keine Videospur' });
        }
      };
      const onMeta = () => finish(true);
      const onErr = () => finish(false, 'Browser kann das Video nicht abspielen (Codec/Container nicht unterstützt)');
      const tid = setTimeout(() => finish(false, 'Zeitüberschreitung beim Laden der Video-Metadaten'), 15000);
      el.addEventListener('loadedmetadata', onMeta);
      el.addEventListener('error', onErr);
      el.src = url;
    });
  }

  // ============================================================
  // Öffentliche API
  // ============================================================
  async function splitMedia(file, options = {}) {
    const o = Object.assign({ maxAudioDuration: 1500, onProgress: () => {}, videoElement: null }, options);
    const warnings = [];
    const audioOnly = (file.type || '').startsWith('audio/') || (!file.type && AUDIO_ONLY_EXT.test(file.name));

    const videoP = audioOnly
      ? Promise.resolve({ ok: false, why: 'Audiodatei' })
      : openVideo(file, o.videoElement);
    const audioP = extractAudio(file, o.maxAudioDuration, (v) => o.onProgress(v, 'Audio extrahieren'), warnings)
      .catch((e) => { warnings.push(e.message); return null; });

    const [v, a] = await Promise.all([videoP, audioP]);
    if (!v.ok && !audioOnly) warnings.push('Video: ' + v.why);
    if (!v.ok && !a) throw new Error('Datei konnte weder als Video noch als Audio gelesen werden. ' + warnings.join(' '));

    const audio = a && {
      samples: a.samples,
      sampleRate: a.sampleRate,
      duration: a.samples.length / a.sampleRate,
      method: a.method,
      nativeSampleRateVerified: a.verified
    };
    if (!audio && !audioOnly) warnings.push('Keine Audiospur gefunden.');

    const video = v.ok ? v.video : null;
    return {
      kind: video ? 'video' : 'audio',
      file,
      video,
      audio,
      warnings,
      release() { if (video) { URL.revokeObjectURL(video.url); } }
    };
  }

  window.splitMedia = splitMedia;
})();

/* ============================================================
 * Videoanalyse (Port aus videoanalyseindex.html) – ohne DOM-Abhängigkeit
 *   const r = await analyzeVideoElement(videoEl, { config, signal }, onProgress(0..1))
 * ============================================================ */
(function () {
  'use strict';

  const DEFAULTS = {
    ANALYSIS_WIDTH: 160, ANALYSIS_HEIGHT: 90, SAMPLE_FPS: 10,
    GRID_COLS: 16, GRID_ROWS: 9,
    MOTION_MIN_DELTA_TIME: 1 / 120, SEEK_TIMEOUT_MS: 3000, STUCK_SAMPLES_LIMIT: 2,
    BLANK_LUMINANCE_THRESHOLD: 10, BLANK_DIFF_THRESHOLD: 2, BLANK_STREAK_LIMIT: 50,
    CUT_THRESHOLD: 36, CUT_MIN_DISTANCE: 0.35
  };

  // ---------- Farbraum ----------
  const srgbToLinear = (v) => { const n = v / 255; return n <= 0.04045 ? n / 12.92 : Math.pow((n + 0.055) / 1.055, 2.4); };
  const LAB_EPS = 216 / 24389, LAB_KAPPA = 24389 / 27;
  const labF = (t) => (t > LAB_EPS ? Math.cbrt(t) : (LAB_KAPPA * t + 16) / 116);
  function rgbToLab(r, g, b) {
    const lr = srgbToLinear(r), lg = srgbToLinear(g), lb = srgbToLinear(b);
    const x = lr * 0.4124564 + lg * 0.3575761 + lb * 0.1804375;
    const y = lr * 0.2126729 + lg * 0.7151522 + lb * 0.0721750;
    const z = lr * 0.0193339 + lg * 0.1191920 + lb * 0.9503041;
    const fx = labF(x / 0.95047), fy = labF(y), fz = labF(z / 1.08883);
    return { l: 116 * fy - 16, a: 500 * (fx - fy), b: 200 * (fy - fz) };
  }
  function avgPairwiseDeltaE(L, A, B, count) {
    if (count < 2) return 0;
    let sum = 0, pairs = 0;
    for (let i = 0; i < count; i++) {
      for (let j = i + 1; j < count; j++) {
        const dL = L[i] - L[j], dA = A[i] - A[j], dB = B[i] - B[j];
        sum += Math.sqrt(dL * dL + dA * dA + dB * dB);
        pairs++;
      }
    }
    return pairs > 0 ? sum / pairs : 0;
  }

  // ---------- Frame-Analyse (Puffer pro Analyse, keine Globals) ----------
  function createFrameAnalyzer(cfg) {
    const W = cfg.ANALYSIS_WIDTH, H = cfg.ANALYSIS_HEIGHT, COLS = cfg.GRID_COLS, ROWS = cfg.GRID_ROWS, N = COLS * ROWS;
    const sumR = new Float64Array(N), sumG = new Float64Array(N), sumB = new Float64Array(N), cnt = new Int32Array(N);
    const LL = new Float64Array(N), LA = new Float64Array(N), LB = new Float64Array(N);
    const bw = W / COLS, bh = H / ROWS;

    return function analyzeFrame(data, prev, deltaTime) {
      const hasPrev = !!prev;
      sumR.fill(0); sumG.fill(0); sumB.fill(0); cnt.fill(0);
      let lumSum = 0, diffSum = 0, count = 0;

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i + 1], b = data[i + 2];
        lumSum += 0.2126 * r + 0.7152 * g + 0.0722 * b;
        count++;
        const px = i / 4, x = px % W, y = Math.floor(px / W);
        const bi = Math.min(ROWS - 1, Math.floor(y / bh)) * COLS + Math.min(COLS - 1, Math.floor(x / bw));
        sumR[bi] += r; sumG[bi] += g; sumB[bi] += b; cnt[bi]++;
        if (hasPrev) diffSum += (Math.abs(r - prev[i]) + Math.abs(g - prev[i + 1]) + Math.abs(b - prev[i + 2])) / 3;
      }
      const meanLum = lumSum / count;
      for (let k = 0; k < N; k++) {
        const c = cnt[k] || 1;
        const lab = rgbToLab(sumR[k] / c, sumG[k] / c, sumB[k] / c);
        LL[k] = lab.l; LA[k] = lab.a; LB[k] = lab.b;
      }
      const colorContrastRaw = avgPairwiseDeltaE(LL, LA, LB, N);
      if (!hasPrev) return { colorContrastRaw, motionRaw: 0, cutDiffRaw: 0, meanLuminance: meanLum, pixelDiff: 0 };
      const avgDiff = diffSum / count;
      const motionRaw = avgDiff / Math.max(deltaTime || 0, cfg.MOTION_MIN_DELTA_TIME);
      return { colorContrastRaw, motionRaw, cutDiffRaw: avgDiff, meanLuminance: meanLum, pixelDiff: avgDiff };
    };
  }

  // ---------- Hilfen ----------
  const abortError = () => new DOMException('Analyse abgebrochen', 'AbortError');
  const average = (a) => (a.length ? a.reduce((s, v) => s + v, 0) / a.length : 0);
  const nextFrame = () => new Promise((res) => {
    if ('requestIdleCallback' in window) requestIdleCallback(() => res(), { timeout: 50 });
    else setTimeout(res, 0);
  });

  function effectiveDuration(video) {
    let d = video.duration;
    try {
      if (video.seekable && video.seekable.length > 0) {
        const end = video.seekable.end(video.seekable.length - 1);
        if (isFinite(end) && end > 0 && end < d) d = end;
      }
    } catch (e) { /* ignorieren */ }
    return d;
  }

  function seekVideo(video, time, timeoutMs) {
    return new Promise((resolve, reject) => {
      let settled = false;
      const cleanup = () => {
        clearTimeout(tid);
        video.removeEventListener('seeked', onSeeked);
        video.removeEventListener('error', onError);
      };
      const onSeeked = () => { if (settled) return; settled = true; cleanup(); resolve(); };
      const onError = () => { if (settled) return; settled = true; cleanup(); reject(new Error('Video konnte nicht gelesen werden.')); };
      const tid = setTimeout(() => {
        if (settled) return; settled = true; cleanup(); reject(new Error('Zeitüberschreitung beim Springen im Video.'));
      }, timeoutMs);
      video.addEventListener('seeked', onSeeked, { once: true });
      video.addEventListener('error', onError, { once: true });
      video.currentTime = time;
    });
  }

  function detectCuts(data, cfg) {
    const cuts = [];
    let last = -Infinity;
    for (let i = 1; i < data.length - 1; i++) {
      const c = data[i], p = data[i - 1], n = data[i + 1];
      const isPeak = c.cutDiffRaw >= p.cutDiffRaw && c.cutDiffRaw >= n.cutDiffRaw;
      if (isPeak && c.cutDiffRaw >= cfg.CUT_THRESHOLD && c.time - last >= cfg.CUT_MIN_DISTANCE) {
        cuts.push({ time: c.time, diffRaw: c.cutDiffRaw });
        last = c.time;
      }
    }
    return cuts;
  }

  // ---------- Hauptfunktion ----------
  async function analyzeVideoElement(video, options = {}, onProgress = () => {}) {
    const cfg = Object.assign({}, DEFAULTS, options.config || {});
    const signal = options.signal;
    if (!video.duration || !isFinite(video.duration)) throw new Error('Videodauer unbekannt (Metadaten nicht geladen).');

    const W = cfg.ANALYSIS_WIDTH, H = cfg.ANALYSIS_HEIGHT;
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const bufs = [new Uint8ClampedArray(W * H * 4), new Uint8ClampedArray(W * H * 4)];
    const analyzeFrame = createFrameAnalyzer(cfg);

    const draw = () => {
      const vw = video.videoWidth || W, vh = video.videoHeight || H;
      const ca = W / H, va = vw / vh;
      let dw, dh;
      if (va > ca) { dw = W; dh = W / va; } else { dh = H; dw = H * va; }
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);
      ctx.drawImage(video, (W - dw) / 2, (H - dh) / 2, dw, dh);
    };

    const results = [], warnings = [];
    const duration = effectiveDuration(video);
    const totalSamples = Math.max(1, Math.ceil(duration * cfg.SAMPLE_FPS));
    let previousFrame = null, bufIdx = 0, lastActual = -1, stuck = 0, blankStreak = 0;

    for (let i = 0; i < totalSamples; i++) {
      if (signal && signal.aborted) throw abortError();
      const target = i / cfg.SAMPLE_FPS;
      if (target >= duration) break;

      await seekVideo(video, target, cfg.SEEK_TIMEOUT_MS);
      const time = video.currentTime;

      if (time <= lastActual + 0.001) {
        stuck++;
        if (stuck >= cfg.STUCK_SAMPLES_LIMIT) {
          warnings.push(`Video-Seek hängt bei ${time.toFixed(1)} s – Analyse dort beendet.`);
          break;
        }
      } else stuck = 0;
      lastActual = time;

      draw();
      const imageData = ctx.getImageData(0, 0, W, H);
      const prevTime = results.length ? results[results.length - 1].time : null;
      const frame = analyzeFrame(imageData.data, previousFrame, prevTime === null ? null : time - prevTime);
      results.push({ time, colorContrastRaw: frame.colorContrastRaw, motionRaw: frame.motionRaw, cutDiffRaw: frame.cutDiffRaw });

      const isBlank = previousFrame !== null &&
        frame.meanLuminance < cfg.BLANK_LUMINANCE_THRESHOLD && frame.pixelDiff < cfg.BLANK_DIFF_THRESHOLD;
      blankStreak = isBlank ? blankStreak + 1 : 0;

      const buf = bufs[bufIdx];
      buf.set(imageData.data);
      previousFrame = buf;
      bufIdx = 1 - bufIdx;

      if (blankStreak >= cfg.BLANK_STREAK_LIMIT) {
        results.splice(results.length - blankStreak, blankStreak);
        warnings.push('Leeres/schwarzes Videoende erkannt und abgeschnitten.');
        break;
      }
      onProgress(Math.min(1, (i + 1) / totalSamples));
      if (i % 4 === 0) await nextFrame();
    }

    if (!results.length) throw new Error('Keine Videoergebnisse.');
    const cuts = detectCuts(results, cfg);
    const dur = results[results.length - 1].time;
    onProgress(1);
    return {
      color_contrast_raw: average(results.map((r) => r.colorContrastRaw)),
      motion_raw: average(results.map((r) => r.motionRaw)),
      cut_count: cuts.length,
      seconds_per_cut: cuts.length > 0 ? dur / cuts.length : null,
      duration_seconds: dur,
      sample_count: results.length,
      cuts,
      warnings
    };
  }

  window.analyzeVideoElement = analyzeVideoElement;
})();

/* ============================================================
 * Orchestrierung + Widget
 *   const res = await analyzeMedia(file, { onProgress, exportJson, workerUrl, signal })
 *   mountMediaAnalyzer('#ziel', { onResult })     oder  <div data-media-analyzer></div>
 * Ablauf: splitten -> Video analysieren -> Audio analysieren (nacheinander)
 * ============================================================ */
(function () {
  'use strict';

  const SCRIPT_SRC = (document.currentScript && document.currentScript.src) || null;
  const defaultWorkerUrl = () => {
    try { return new URL('worker.js', SCRIPT_SRC || location.href).href; } catch (e) { return 'worker.js'; }
  };
  const abortError = () => new DOMException('Analyse abgebrochen', 'AbortError');

  function runWorker(samples, sampleRate, options, workerUrl, signal, onProgress) {
    return new Promise((resolve, reject) => {
      if (signal && signal.aborted) return reject(abortError());
      const worker = new Worker(workerUrl);
      const onAbort = () => { worker.terminate(); reject(abortError()); };
      if (signal) signal.addEventListener('abort', onAbort, { once: true });
      const done = (fn, v) => { if (signal) signal.removeEventListener('abort', onAbort); worker.terminate(); fn(v); };
      worker.onmessage = (e) => {
        const m = e.data;
        if (m.type === 'progress') onProgress(m.value, m.stage);
        else if (m.type === 'result') done(resolve, m.result);
        else if (m.type === 'error') done(reject, new Error(m.message));
      };
      worker.onerror = (e) => done(reject, new Error(e.message || 'Worker-Fehler (worker.js nicht gefunden? -> option workerUrl)'));
      worker.postMessage({ type: 'analyze', samples, sampleRate, options }, [samples.buffer]);
    });
  }

  /**
   * Datei -> { kind, split, video, audio, errors, warnings, elapsed_ms }
   * onProgress({ stage: 'split'|'video'|'audio'|'done', progress: 0..1, label })
   */
  async function analyzeMedia(file, options = {}) {
    const o = Object.assign({
      maxAudioDuration: 1500, exportJson: false, workerUrl: defaultWorkerUrl(),
      onProgress: () => {}, video: {}, signal: null, keepMedia: false
    }, options);
    const t0 = performance.now();
    const timings = {};
    let tLap = t0;
    const lap = (name) => { const n = performance.now(); timings[name] = Math.round(n - tLap); tLap = n; };
    const errors = {}, warnings = [];
    const report = (stage, progress, label) => o.onProgress({ stage, progress: Math.min(1, progress), label });
    const checkAbort = () => { if (o.signal && o.signal.aborted) throw abortError(); };

    // 1) Splitten
    report('split', 0, 'Datei wird getrennt (Video / Audio)');
    const media = await splitMedia(file, {
      maxAudioDuration: o.maxAudioDuration,
      onProgress: (v) => report('split', v * 0.1, 'Audio wird extrahiert')
    });
    warnings.push(...media.warnings);
    lap('split_ms');
    const stages = (media.video ? 1 : 0) + (media.audio ? 1 : 0);
    const span = 0.9 / Math.max(1, stages);
    let cursor = 0.1;
    let videoRes = null, audioRes = null;

    try {
      // 2) Video
      if (media.video) {
        checkAbort();
        try {
          videoRes = await analyzeVideoElement(media.video.element, { config: o.video.config, signal: o.signal },
            (v) => report('video', cursor + v * span, 'Video wird analysiert'));
          warnings.push(...videoRes.warnings);
        } catch (e) {
          if (e.name === 'AbortError') throw e;
          errors.video = e.message;
        }
        cursor += span;
        lap('video_ms');
      }

      // 3) Audio
      if (media.audio) {
        checkAbort();
        const { samples, sampleRate, method, nativeSampleRateVerified } = media.audio;
        try {
          audioRes = await runWorker(samples, sampleRate, { exportJson: o.exportJson }, o.workerUrl, o.signal,
            (v, stage) => report('audio', cursor + v * span, 'Audio: ' + stage));
          audioRes.meta.native_samplerate_verified = nativeSampleRateVerified;
          audioRes.meta.audio_extraction = method;
        } catch (e) {
          if (e.name === 'AbortError') throw e;
          errors.audio = e.message;
        }
        cursor += span;
        lap('audio_ms');
      }
    } finally {
      if (!o.keepMedia) media.release();
    }

    report('done', 1, 'Fertig');
    return {
      file: { name: file.name, size: file.size, type: file.type },
      kind: media.kind,
      split: {
        video: media.video && { duration: media.video.duration, width: media.video.width, height: media.video.height },
        audio: audioRes ? { sampleRate: audioRes.meta.sample_rate, duration: audioRes.meta.duration_seconds,
          method: audioRes.meta.audio_extraction, nativeSampleRateVerified: audioRes.meta.native_samplerate_verified } : null
      },
      video: videoRes,
      audio: audioRes,
      errors, warnings,
      elapsed_ms: Math.round(performance.now() - t0),
      timings: Object.assign(timings, { total_ms: Math.round(performance.now() - t0) }),
      media: o.keepMedia ? media : undefined
    };
  }

  // ============================================================
  // Formatierung
  // ============================================================
  const fmt = (v, d = 2) => (typeof v === 'number' && isFinite(v) ? v.toFixed(d).replace('.', ',') : '–');

  function audioText(out) {
    const lw = Math.max(...out.zeilen.filter(([l]) => l).map(([l]) => l.length));
    let s = '';
    for (const [l, v] of out.zeilen) s += l ? `${l.padEnd(lw)} : ${v}\n` : '\n';
    s += `\n${'>>> GESAMT-AUFMERKSAMKEITSSCORE (0-100)'.padEnd(lw)} : ${out.aufmerksamkeits_score}\n`;
    return s;
  }

  function resultText(res) {
    let s = '=============== VIDEO-ANALYSE ===============\n\n';
    if (res.video) {
      s += `Farbkontrast (roh) : ${fmt(res.video.color_contrast_raw)}\n`;
      s += `Bewegung (roh)     : ${fmt(res.video.motion_raw)}\n`;
      s += `Zeit pro Schnitt   : ${res.video.seconds_per_cut === null ? '–' : fmt(res.video.seconds_per_cut) + ' s'}  (${res.video.cut_count} Schnitte)\n`;
    } else s += res.errors.video ? `Fehler: ${res.errors.video}\n` : 'Kein Video vorhanden.\n';

    s += '\n=============== AUDIO-ANALYSE ===============\n\n';
    if (res.audio) s += audioText(res.audio.output);
    else s += res.errors.audio ? `Fehler: ${res.errors.audio}\n` : 'Keine Audiospur gefunden.\n';

    if (res.timings) {
      const t = res.timings;
      const sec = (ms) => (ms / 1000).toFixed(1).replace('.', ',') + ' s';
      s += '\n=============== ZEIT ===============\n\n';
      s += `Trennen (Video/Audio) : ${sec(t.split_ms)}\n`;
      if (t.video_ms != null) s += `Videoanalyse          : ${sec(t.video_ms)}\n`;
      if (t.audio_ms != null) s += `Audioanalyse          : ${sec(t.audio_ms)}\n`;
      s += `GESAMT                : ${sec(t.total_ms)}\n`;
    }

    if (res.warnings.length) s += '\n⚠ ' + res.warnings.join('\n⚠ ') + '\n';
    return s;
  }

  // ============================================================
  // Widget
  // ============================================================
  const STYLE = `
.ma-root{font-family:system-ui,sans-serif;max-width:760px}
.ma-root .ma-row,.ma-root .ma-opt{display:block;margin:8px 0}
.ma-root button{padding:8px 14px;margin-right:6px;font-size:14px}
.ma-root progress{width:100%;height:18px}
.ma-root pre{background:rgba(127,127,127,.15);padding:8px;overflow-x:auto;font-size:12px}
.ma-root .ma-status{white-space:pre-line;opacity:.8}
.ma-root .ma-dl a{display:block}`;

  const ACCEPT = 'video/*,.mp4,.m4v,.mov,.webm,.mkv,.ogv,.3gp';
  const STAGE_LABEL = { split: 'Trenne Video/Audio', video: 'Analysiere Video', audio: 'Analysiere Audio', done: 'Fertig' };

  function mountMediaAnalyzer(target, options = {}) {
    const root = typeof target === 'string' ? document.querySelector(target) : target;
    if (!root) throw new Error('mountMediaAnalyzer: Ziel-Element nicht gefunden');
    if (!document.getElementById('ma-style')) {
      const st = document.createElement('style'); st.id = 'ma-style'; st.textContent = STYLE; document.head.appendChild(st);
    }
    root.classList.add('ma-root');
    root.innerHTML = `
      <input type="file" class="ma-file" accept="${ACCEPT}">
      <label class="ma-opt"><input type="checkbox" class="ma-export"> onset.json / pitch.json exportieren</label>
      <div class="ma-row"><button class="ma-run">Analysieren</button><button class="ma-cancel" disabled>Abbrechen</button></div>
      <p class="ma-status">Bereit.</p>
      <progress class="ma-bar" value="0" max="1"></progress>
      <p>Laufzeit: <span class="ma-timer">0,0 s</span></p>
      <pre class="ma-out"></pre>
      <div class="ma-dl"></div>
      <details><summary>Rohes Ergebnis-JSON</summary><pre class="ma-json"></pre></details>`;
    const q = (c) => root.querySelector(c);
    const timerEl = q('.ma-timer');
    const [fileEl, runBtn, cancelBtn, statusEl, bar, outEl, dlEl, jsonEl, exportEl] =
      ['.ma-file', '.ma-run', '.ma-cancel', '.ma-status', '.ma-bar', '.ma-out', '.ma-dl', '.ma-json', '.ma-export'].map(q);
    let ac = null;

    const addDownload = (name, text) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      a.download = name; a.textContent = '⬇ ' + name;
      dlEl.appendChild(a);
    };

    async function analyze(file) {
      file = file || fileEl.files[0];
      if (!file) { alert('Bitte zuerst eine Videodatei wählen.'); return null; }
      runBtn.disabled = true; cancelBtn.disabled = false;
      outEl.textContent = ''; jsonEl.textContent = ''; dlEl.innerHTML = '';
      bar.value = 0; statusEl.textContent = 'Starte …';
      ac = new AbortController();
      const tStart = performance.now();
      const tick = setInterval(() => {
        timerEl.textContent = ((performance.now() - tStart) / 1000).toFixed(1).replace('.', ',') + ' s';
      }, 100);
      try {
        const res = await analyzeMedia(file, Object.assign({}, options, {
          exportJson: exportEl.checked, signal: ac.signal,
          onProgress: (p) => {
            bar.value = p.progress;
            statusEl.textContent = `${STAGE_LABEL[p.stage] || p.stage} – ${Math.round(p.progress * 100)} %`;
            if (options.onProgress) options.onProgress(p);
          }
        }));
        statusEl.textContent = `Fertig in ${(res.elapsed_ms / 1000).toFixed(1)} s`;
        outEl.textContent = resultText(res);

        const { json_export, ...audioRest } = res.audio || {};
        jsonEl.textContent = JSON.stringify(Object.assign({}, res, { audio: res.audio ? audioRest : null }), null, 2);
        addDownload('analyse-ergebnis.json', jsonEl.textContent);
        if (json_export) for (const [n, t] of Object.entries(json_export)) addDownload(n, t);

        root.dispatchEvent(new CustomEvent('mediaanalyse:result', { detail: res, bubbles: true }));
        if (options.onResult) options.onResult(res);
        return res;
      } catch (err) {
        statusEl.textContent = err.name === 'AbortError' ? 'Abgebrochen.' : 'Fehler: ' + err.message;
        return null;
      } finally {
        runBtn.disabled = false; cancelBtn.disabled = true; ac = null;
        clearInterval(tick);
        timerEl.textContent = ((performance.now() - tStart) / 1000).toFixed(1).replace('.', ',') + ' s (gesamt)';
      }
    }

    runBtn.addEventListener('click', () => analyze());
    cancelBtn.addEventListener('click', () => ac && ac.abort());
    return { analyze, cancel: () => ac && ac.abort(), destroy() { root.innerHTML = ''; root.classList.remove('ma-root'); } };
  }

  window.MediaAnalyzer = { analyzeMedia, mountMediaAnalyzer, splitMedia, analyzeVideoElement, resultText };
  window.analyzeMedia = analyzeMedia;
  window.mountMediaAnalyzer = mountMediaAnalyzer;

  // Auto-Mount: <div data-media-analyzer></div>
  const auto = () => document.querySelectorAll('[data-media-analyzer]').forEach((el) => mountMediaAnalyzer(el));
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', auto); else auto();
})();

  </script>

  <script>
    const workerUrl = URL.createObjectURL(
      new Blob([document.getElementById('worker-src').textContent], { type: 'text/javascript' })
    );
    mountMediaAnalyzer('#app', { workerUrl });
  </script>
</body>
</html>
